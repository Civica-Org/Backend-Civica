# --- Application ---
spring.application.name=Backend-Civica
spring.config.import=optional:file:.env[.properties],optional:file:Backend-Civica/.env[.properties]

# --- DataSource PostgreSQL (locale) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/civica_db
spring.datasource.username=civica_user
spring.datasource.password=Civica@2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway (migrations SQL) ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# --- Serveur ---
server.port=8080

# --- Java Mail (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=civika.contact@gmail.com
spring.mail.password=gqrqkhaaqhkyydin
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

# --- Upload de fichiers (pièces justificatives) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- CIVICA - Variables applicatives ---
civica.app.jwtSecret=civicaPlatformSuperSecretKey2026SecurityStandardForHmacSha256MustBeLongEnough!
civica.app.jwtExpirationMs=86400000
civica.app.frontendUrl=http://localhost:5173
civica.upload.dir=uploads

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Civica IA : Google Gemini API Gratuite & Repli Déterministe (Chapitre 8) ---
civica.ai.provider=${CIVICA_AI_PROVIDER:gemini}
civica.ai.gemini.baseUrl=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
civica.ai.gemini.apiKey=${GEMINI_API_KEY:}
civica.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
civica.ai.gemini.fallbackModel=${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
civica.ai.timeoutMs=${CIVICA_AI_TIMEOUT_MS:10000}

