# ==============================================================================
# CIVICA - Configuration PRODUCTION (Render Cloud)
# Toutes les valeurs sensibles sont injectées via les variables d'environnement Render
# ==============================================================================

# --- DataSource PostgreSQL (Render managed DB) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- CIVICA - Secrets ---
civica.app.jwtSecret=${JWT_SECRET}
civica.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
civica.app.frontendUrl=${FRONTEND_URL}
civica.upload.dir=/opt/render/project/uploads

# --- Java Mail (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:civika.contact@gmail.com}
spring.mail.password=${MAIL_PASSWORD:gqrqkhaaqhkyydin}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

